name: API Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check GitHub Secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_USERNAME: ${{ secrets.OAUTH_USERNAME }}
          OAUTH_PASSWORD: ${{ secrets.OAUTH_PASSWORD }}
          BASIC_USERNAME: ${{ secrets.BASIC_USERNAME }}
          BASIC_PASSWORD: ${{ secrets.BASIC_PASSWORD }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          if [ -z "$API_KEY" ]; then echo "API_KEY is EMPTY"; exit 1; fi
          if [ -z "$OAUTH_CLIENT_ID" ]; then echo "OAUTH_CLIENT_ID is EMPTY"; exit 1; fi
          if [ -z "$OAUTH_CLIENT_SECRET" ]; then echo "OAUTH_CLIENT_SECRET is EMPTY"; exit 1; fi
          if [ -z "$BASIC_USERNAME" ]; then echo "BASIC_USERNAME is EMPTY"; exit 1; fi
          if [ -z "$BASIC_PASSWORD" ]; then echo "BASIC_PASSWORD is EMPTY"; exit 1; fi
          if [ -z "$BEARER_TOKEN" ]; then echo "BEARER_TOKEN is EMPTY"; exit 1; fi

          echo "All required secrets exist"

      - name: Run Playwright tests
        env:
          BASE_URL: https://billpay-api.gauravkhurana-practice-api.workers.dev
          API_KEY: ${{ secrets.API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_USERNAME: ${{ secrets.OAUTH_USERNAME }}
          OAUTH_PASSWORD: ${{ secrets.OAUTH_PASSWORD }}
          BASIC_USERNAME: ${{ secrets.BASIC_USERNAME }}
          BASIC_PASSWORD: ${{ secrets.BASIC_PASSWORD }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/