name: API Automation Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check GitHub Secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_USERNAME: ${{ secrets.OAUTH_USERNAME }}
          OAUTH_PASSWORD: ${{ secrets.OAUTH_PASSWORD }}
        run: |
          if [ -z "$API_KEY" ]; then echo "API_KEY is EMPTY"; else echo "API_KEY exists"; fi
          if [ -z "$OAUTH_CLIENT_ID" ]; then echo "OAUTH_CLIENT_ID is EMPTY"; else echo "OAUTH_CLIENT_ID exists"; fi
          if [ -z "$OAUTH_CLIENT_SECRET" ]; then echo "OAUTH_CLIENT_SECRET is EMPTY"; else echo "OAUTH_CLIENT_SECRET exists"; fi
          if [ -z "$OAUTH_USERNAME" ]; then echo "OAUTH_USERNAME is EMPTY"; else echo "OAUTH_USERNAME exists"; fi
          if [ -z "$OAUTH_PASSWORD" ]; then echo "OAUTH_PASSWORD is EMPTY"; else echo "OAUTH_PASSWORD exists"; fi

      - name: Run Playwright tests
        env:
          BASE_URL: https://billpay-api.gauravkhurana-practice-api.workers.dev
          API_KEY: ${{ secrets.API_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_USERNAME: ${{ secrets.OAUTH_USERNAME }}
          OAUTH_PASSWORD: ${{ secrets.OAUTH_PASSWORD }}
        run: npx playwright test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/