name: API Automation Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "BASE_URL=https://billpay-api.gauravkhurana-practice-api.workers.dev" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env
          echo "OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}" >> .env
          echo "OAUTH_CLIENT_SECRET=${{ secrets.OAUTH_CLIENT_SECRET }}" >> .env
          echo "OAUTH_USERNAME=${{ secrets.OAUTH_USERNAME }}" >> .env
          echo "OAUTH_PASSWORD=${{ secrets.OAUTH_PASSWORD }}" >> .env

      - name: Check environment variables
        run: |
          test -n "${{ secrets.API_KEY }}" \
            && echo "API_KEY exists" \
            || echo "API_KEY is EMPTY"

          test -n "${{ secrets.OAUTH_CLIENT_ID }}" \
            && echo "OAUTH_CLIENT_ID exists" \
            || echo "OAUTH_CLIENT_ID is EMPTY"

          test -n "${{ secrets.OAUTH_CLIENT_SECRET }}" \
            && echo "OAUTH_CLIENT_SECRET exists" \
            || echo "OAUTH_CLIENT_SECRET is EMPTY"

          test -n "${{ secrets.OAUTH_USERNAME }}" \
            && echo "OAUTH_USERNAME exists" \
            || echo "OAUTH_USERNAME is EMPTY"

          test -n "${{ secrets.OAUTH_PASSWORD }}" \
            && echo "OAUTH_PASSWORD exists" \
            || echo "OAUTH_PASSWORD is EMPTY"

      # 6. Run Playwright API tests
      - name: Run Playwright Tests
        run: npx playwright test

      # 7. Upload Playwright report even when tests fail
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/